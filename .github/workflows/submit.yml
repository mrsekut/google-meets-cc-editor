# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Submit to Web Store"
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Type check
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Build the extension
        run: bun run build
      - name: Package the extension into a zip artifact
        run: bun run package
      - name: Upload and publish to Chrome Web Store
        run: bunx chrome-webstore-upload-cli@4.0.2 --source build/chrome-mv3-prod.zip --extension-id bgodplojfdhmhgpkbiimckmkenhfjidn
        env:
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
